{% set name = "marko" %}
{% set version = "2.2.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3a5bac3a2e3ccb53cd97dcd29e422c4f701c29ec7c61be4c0d827321ef057553

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps
  entry_points:
    - marko=marko.cli:main

requirements:
  host:
    - pip
    - python
    - pdm-backend
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - marko
  commands:
    - pip check
    - marko --help
    - python -m pytest -vv tests
  requires:
    - pip
    - pytest
    - python-slugify
    - pygments

about:
  home: https://github.com/frostming/marko
  dev_url: https://github.com/frostming/marko
  doc_url: https://marko-py.readthedocs.io
  summary: A markdown parser with high extensibility.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: |
    Marko is a markdown parser written in pure Python that complies with CommonMark's spec v0.31.2.
    It is designed to be highly extensible.

extra:
  recipe-maintainers:
    - xhochy
    - asford
